<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Document Storage</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #d9fff9;
            min-height: 100vh;
            padding: 30px;
            color: #123;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        /* Header */
        .header {
            background: #20c9b5;
            color: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
        }

        /* Upload box */
        .upload-box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 2px dashed #20c9b5;
        }

        .upload-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .upload-box h2 {
            margin-bottom: 10px;
        }

        .upload-box p {
            color: #777;
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            background: #20c9b5;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .upload-btn:hover {
            background: #149f90;
            transform: translateY(-2px);
        }

        #fileInput {
            display: none;
        }

        /* Search */
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
        }

        .search-box input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #20c9b5;
        }

        /* Document section */
        .section-title {
            margin-bottom: 15px;
            font-size: 22px;
        }

        .documents {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Document card */
        .document-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .document-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .file-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .file-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .file-info {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .view-btn {
            background: #d9f7f3;
            color: #087f73;
        }

        .download-btn {
            background: #dceeff;
            color: #1261a0;
        }

        .delete-btn {
            background: #ffe0e0;
            color: #c62828;
        }

        .btn:hover {
            opacity: 0.8;
        }

        /* Empty message */
        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            color: #777;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
        }

        /* Notification */
        .message {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #123;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .upload-box {
                padding: 20px;
            }

            .documents {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>📁 My Document Storage</h1>
        <p>Upload, store, view and download your documents easily.</p>
    </div>

    <!-- UPLOAD -->
    <div class="upload-box">

        <div class="upload-icon">📄</div>

        <h2>Upload Your Documents</h2>

        <p>
            Select PDF, Word, text or image files from your computer.
        </p>

        <label for="fileInput" class="upload-btn">
            ➕ Choose Documents
        </label>

        <input
            type="file"
            id="fileInput"
            multiple
            accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png"
        >

    </div>

    <!-- SEARCH -->
    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search your documents..."
            oninput="searchDocuments()"
        >

    </div>

    <!-- DOCUMENTS -->
    <h2 class="section-title">
        📚 My Documents
    </h2>

    <div id="documents" class="documents"></div>

</div>

<!-- MESSAGE -->
<div id="message" class="message"></div>


<script>

    /* =====================================
       INDEXED DB
    ===================================== */

    let db;

    const request = indexedDB.open("MyDocumentStorage", 1);


    /* Create database */

    request.onupgradeneeded = function(event) {

        db = event.target.result;

        if (!db.objectStoreNames.contains("documents")) {

            db.createObjectStore("documents", {
                keyPath: "id",
                autoIncrement: true
            });

        }
    };


    /* Database opened */

    request.onsuccess = function(event) {

        db = event.target.result;

        displayDocuments();
    };


    /* Database error */

    request.onerror = function() {

        showMessage("❌ Unable to open document storage.");

    };


    /* =====================================
       UPLOAD DOCUMENT
    ===================================== */

    document.getElementById("fileInput")
        .addEventListener("change", function(event) {

            const files = event.target.files;

            if (!files || files.length === 0) {
                return;
            }

            Array.from(files).forEach(function(file) {

                saveDocument(file);

            });

            /* Reset input */

            event.target.value = "";

        });


    /* =====================================
       SAVE DOCUMENT
    ===================================== */

    function saveDocument(file) {

        const transaction =
            db.transaction(["documents"], "readwrite");

        const store =
            transaction.objectStore("documents");


        const documentData = {

            name: file.name,

            type: file.type,

            size: file.size,

            file: file,

            date: new Date().toISOString()

        };


        const request =
            store.add(documentData);


        request.onsuccess = function() {

            showMessage("✅ Document uploaded successfully!");

            displayDocuments();

        };


        request.onerror = function() {

            showMessage("❌ Could not save document.");

        };

    }


    /* =====================================
       DISPLAY DOCUMENTS
    ===================================== */

    function displayDocuments(searchText = "") {

        const container =
            document.getElementById("documents");

        container.innerHTML = "";


        const transaction =
            db.transaction(["documents"], "readonly");

        const store =
            transaction.objectStore("documents");

        const request =
            store.getAll();


        request.onsuccess = function() {

            const docs = request.result;


            /* Search */

            const filteredDocs = docs.filter(function(doc) {

                return doc.name
                    .toLowerCase()
                    .includes(searchText.toLowerCase());

            });


            if (filteredDocs.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        <div style="font-size:45px;">📂</div>

                        <h3>No documents found</h3>

                        <p>
                            Upload a document to see it here.
                        </p>
                    </div>
                `;

                return;
            }


            /* Show newest first */

            filteredDocs.reverse();


            filteredDocs.forEach(function(doc) {

                const card =
                    document.createElement("div");

                card.className = "document-card";


                const icon =
                    getFileIcon(doc.name);


                const size =
                    formatFileSize(doc.size);


                const date =
                    new Date(doc.date)
                    .toLocaleString();


                card.innerHTML = `

                    <div class="file-icon">
                        ${icon}
                    </div>

                    <div class="file-name">
                        ${escapeHTML(doc.name)}
                    </div>

                    <div class="file-info">

                        📦 Size: ${size}
                        <br>

                        📅 Added: ${date}

                    </div>

                    <div class="actions">

                        <button
                            class="btn view-btn"
                            onclick="viewDocument(${doc.id})">

                            👁 View

                        </button>


                        <button
                            class="btn download-btn"
                            onclick="downloadDocument(${doc.id})">

                            ⬇ Download

                        </button>


                        <button
                            class="btn delete-btn"
                            onclick="deleteDocument(${doc.id})">

                            🗑 Delete

                        </button>

                    </div>

                `;


                container.appendChild(card);

            });

        };

    }


    /* =====================================
       SEARCH
    ===================================== */

    function searchDocuments() {

        const searchInput =
            document.getElementById("searchInput");

        const searchText =
            searchInput.value.trim();


        displayDocuments(searchText);

    }


    /* =====================================
       VIEW DOCUMENT
    ===================================== */

    function viewDocument(id) {

        const transaction =
            db.transaction(["documents"], "readonly");

        const store =
            transaction.objectStore("documents");


        const request =
            store.get(id);


        request.onsuccess = function() {

            const doc = request.result;


            if (!doc) {

                showMessage("❌ Document not found.");

                return;

            }


            const url =
                URL.createObjectURL(doc.file);


            /* Open file */

            window.open(url, "_blank");


            /* Release URL later */

            setTimeout(function() {

                URL.revokeObjectURL(url);

            }, 10000);

        };


        request.onerror = function() {

            showMessage("❌ Unable to open document.");

        };

    }


    /* =====================================
       DOWNLOAD DOCUMENT
    ===================================== */

    function downloadDocument(id) {

        const transaction =
            db.transaction(["documents"], "readonly");

        const store =
            transaction.objectStore("documents");


        const request =
            store.get(id);


        request.onsuccess = function() {

            /* IMPORTANT:
               Use "doc", not "document"
            */

            const doc = request.result;


            if (!doc) {

                showMessage("❌ Document not found.");

                return;

            }


            const url =
                URL.createObjectURL(doc.file);


            const link =
                document.createElement("a");


            link.href = url;

            link.download = doc.name;


            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);


            setTimeout(function() {

                URL.revokeObjectURL(url);

            }, 1000);


            showMessage("⬇ Download started!");

        };


        request.onerror = function() {

            showMessage("❌ Unable to download document.");

        };

    }


    /* =====================================
       DELETE DOCUMENT
    ===================================== */

    function deleteDocument(id) {

        const confirmDelete =
            confirm("Are you sure you want to delete this document?");


        if (!confirmDelete) {

            return;

        }


        const transaction =
            db.transaction(["documents"], "readwrite");

        const store =
            transaction.objectStore("documents");


        const request =
            store.delete(id);


        request.onsuccess = function() {

            showMessage("🗑 Document deleted.");

            displayDocuments();

        };


        request.onerror = function() {

            showMessage("❌ Could not delete document.");

        };

    }


    /* =====================================
       FILE ICON
    ===================================== */

    function getFileIcon(fileName) {

        const extension =
            fileName.split(".").pop().toLowerCase();


        if (extension === "pdf") {

            return "📕";

        }


        if (extension === "doc" ||
            extension === "docx") {

            return "📘";

        }


        if (extension === "txt") {

            return "📄";

        }


        if (extension === "jpg" ||
            extension === "jpeg" ||
            extension === "png") {

            return "🖼️";

        }


        return "📁";

    }


    /* =====================================
       FILE SIZE
    ===================================== */

    function formatFileSize(bytes) {

        if (bytes === 0) {

            return "0 Bytes";

        }


        const units = [
            "Bytes",
            "KB",
            "MB",
            "GB"
        ];


        const i =
            Math.floor(
                Math.log(bytes) / Math.log(1024)
            );


        return (
            (bytes / Math.pow(1024, i))
            .toFixed(2)
            + " "
            + units[i]
        );

    }


    /* =====================================
       SECURITY
       Prevent HTML inside file names
    ===================================== */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /* =====================================
       MESSAGE
    ===================================== */

    function showMessage(text) {

        const message =
            document.getElementById("message");


        message.textContent = text;

        message.style.display = "block";


        setTimeout(function() {

            message.style.display = "none";

        }, 2500);

    }

</script>

</body>
</html>
